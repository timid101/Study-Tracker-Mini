name: Build Offline StudyTracker APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug & Release APKs
        run: |
          if [ -f "StudyTracker_Android_Project/settings.gradle.kts" ]; then
            cd StudyTracker_Android_Project
          fi
          gradle assembleDebug assembleRelease

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyTracker-Android-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/release/*.apk
